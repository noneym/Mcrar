name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch 7-Zip
        run: ./fetch-tools.sh

      - name: Build Mcrar.app
        run: ./build.sh

      - name: Zip app
        run: ditto -c -k --keepParent build/Mcrar.app build/Mcrar.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Mcrar-${{ github.sha }}
          path: build/Mcrar.zip
          retention-days: 30
